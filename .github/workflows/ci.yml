name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions:
  contents: read

jobs:
  required-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout LiNKsites
        uses: actions/checkout@v4
        with:
          # The secret gate scans every commit introduced by this PR/push.
          fetch-depth: 0
      - name: Checkout exact LiNKplatform migration dependency
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKplatform
          ref: 63635ecec576887e5e25080745c4ad169b335508
          path: .ci/linkplatform
          # Private-repository read access must be granted to this workflow.
          # No fallback or skipped RLS suite is permitted if it is absent.
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
      - name: Checkout exact LiNKlibraries authority
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKlibraries
          ref: a7193d40152747db2a03e094fa263f324a971a0b
          path: .ci/linklibraries
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Required production readiness gate
        env:
          LINKSITES_PLATFORM_REPOSITORY: ${{ github.workspace }}/.ci/linkplatform
          W2_02_LIBRARY_REPOSITORY_PATH: ${{ github.workspace }}/.ci/linklibraries
        run: bash scripts/ci-required.sh
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: w2-07-ci-evidence
          path: .ci-artifacts/
          if-no-files-found: error
          include-hidden-files: true
      - name: Dependency and secret scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # actions/checkout checks out the synthetic PR merge commit. Its
            # first parent is the target branch; its second is the exact PR tip.
            base_sha="$(git rev-parse HEAD^1)"
            head_sha="$(git rev-parse HEAD^2)"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$(git rev-parse HEAD)"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              # New branch/root push: scan every reachable commit fail-closed.
              base_sha=""
            fi
          fi

          log_opts="--all"
          if [[ -n "$base_sha" ]]; then
            git cat-file -e "${base_sha}^{commit}"
            git cat-file -e "${head_sha}^{commit}"
            log_opts="${base_sha}..${head_sha}"
          fi

          docker run --rm \
            --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git --redact --verbose --log-opts="$log_opts" /repo
