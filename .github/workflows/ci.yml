name: CI

# Repository-owned application checks.  The managed Fast and Full workflows
# provide the sealed Phase lifecycle; this workflow supplies the LiNKsites
# application commands and the cross-repository inputs they require.
on:
  pull_request:
    branches: [main, staging, development]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

# A new commit on the same PR supersedes every non-final application check.
# The final suite is only labelled after Fast has passed, so cancelling the
# older run cannot convert a cancelled check into a success.
concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: LiNKsites CI
    if: >-
      github.event.pull_request.base.ref == 'development' &&
      startsWith(github.event.pull_request.head.ref, 'phase/') &&
      github.event.action != 'labeled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout exact Phase head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Compute immutable cache keys before Fast
        id: cache-keys
        run: node scripts/ci/write-cache-key-manifest.mjs --runner "${{ runner.os }}" --output .ci-artifacts/cache-key-manifest.json

      - name: Restore Turbo outputs (advisory)
        id: turbo-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ steps.cache-keys.outputs.turbo }}

      - name: Run Fast application profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-fast.sh

      - name: Upload Fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linksites-fast-evidence-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Save Turbo outputs (advisory)
        if: ${{ success() && steps.turbo-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ steps.cache-keys.outputs.turbo }}

  full-production-suite:
    name: full-production-suite
    if: >-
      github.event.pull_request.base.ref == 'development' &&
      startsWith(github.event.pull_request.head.ref, 'phase/') &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'linktrend-full-suite'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact final Phase head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact LiNKplatform migration dependency
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKplatform
          ref: 63635ecec576887e5e25080745c4ad169b335508
          path: .ci/linkplatform
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout exact LiNKlibraries authority
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKlibraries
          ref: a7193d40152747db2a03e094fa263f324a971a0b
          path: .ci/linklibraries
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Keys are computed before install/build steps. Caches are advisory only;
      # all named Full components execute and write fresh evidence regardless.
      - name: Compute immutable cache keys before Full
        id: cache-keys
        run: node scripts/ci/write-cache-key-manifest.mjs --runner "${{ runner.os }}" --output .ci-artifacts/cache-key-manifest.json

      - name: Restore Playwright browser payload (advisory)
        id: playwright-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-keys.outputs.playwright }}

      - name: Restore Turbo outputs (advisory)
        id: turbo-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ steps.cache-keys.outputs.turbo }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Require successful Fast CI on this exact Phase head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gitops/require_exact_ci_success.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Install dependencies for hosted browser checks
        run: pnpm install --frozen-lockfile

      - name: Run deterministic Full runtime preflight
        run: node scripts/ci/full-runtime-preflight.mjs --github-env "${GITHUB_ENV}"

      - name: Run Full application and recovery profile
        env:
          LINKSITES_PLATFORM_REPOSITORY: ${{ github.workspace }}/.ci/linkplatform
          W2_02_LIBRARY_REPOSITORY_PATH: ${{ github.workspace }}/.ci/linklibraries
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The hosted runner already proves the image build and recovery
          # profile. Do not export the multi-GB local layer cache on this gate.
          DOCKER_BUILDKIT_CACHE: disabled
        run: bash scripts/ci-required.sh

      - name: Bind successful suite to exact Phase source and file tree
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci_full_suite_receipt.py write \
            --repo "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --tested-sha "${TESTED_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-url "${WORKFLOW_URL}" \
            --output .ci-artifacts/full-suite-receipt.json

      - name: Upload exact Full application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linksites-full-suite-${{ github.event.pull_request.head.sha }}
          path: .ci-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Save Playwright browser payload (advisory)
        if: ${{ success() && steps.playwright-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-keys.outputs.playwright }}

      - name: Save Turbo outputs (advisory)
        if: ${{ success() && steps.turbo-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ steps.cache-keys.outputs.turbo }}

  promotion-receipt:
    name: LiNKsites Promotion Receipt
    if: >-
      (github.event.pull_request.base.ref == 'staging' || github.event.pull_request.base.ref == 'main') &&
      github.event.action != 'labeled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve authenticated transition and retained Full receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)"
          export PR_BODY="${pr_body}"
          coordinates="$(python3 - <<'PY'
          import json, os, re

          match = re.search(r"<!-- linktrend-promote:\s*(\{.*?\})\s*-->", os.environ.get("PR_BODY", ""), re.S)
          if not match:
              raise SystemExit("promotion_receipt_marker_missing")
          marker = json.loads(match.group(1))
          run_id = str(marker.get("fullRunId") or "").strip()
          receipt_digest = str(marker.get("receiptDigest") or "").strip()
          candidate_head = str(marker.get("candidateHead") or "").strip()
          source_branch = str(marker.get("sourceBranch") or "").strip()
          target_branch = str(marker.get("targetBranch") or "").strip()
          transition = marker.get("transitionReceipt")
          transition_digest = str(marker.get("transitionReceiptDigest") or "").strip()
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("promotion_receipt_full_run_invalid")
          if target_branch != os.environ["TARGET_BRANCH"]:
              raise SystemExit("promotion_receipt_target_branch_mismatch")
          expected_source_branch = {"staging": "development", "main": "staging"}.get(target_branch)
          if source_branch != expected_source_branch:
              raise SystemExit("promotion_receipt_source_branch_mismatch")
          if candidate_head != os.environ["CANDIDATE_HEAD"]:
              raise SystemExit("promotion_receipt_candidate_head_mismatch")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", receipt_digest):
              raise SystemExit("promotion_receipt_digest_invalid")
          if not isinstance(transition, dict):
              raise SystemExit("promotion_receipt_transition_missing")
          if transition.get("targetBranch") != source_branch:
              raise SystemExit("promotion_receipt_transition_branch_mismatch")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", transition_digest):
              raise SystemExit("promotion_receipt_transition_digest_invalid")
          if transition.get("receiptDigest") != transition_digest:
              raise SystemExit("promotion_receipt_transition_digest_mismatch")
          with open("transition-receipt.json", "w", encoding="utf-8") as handle:
              json.dump(transition, handle)
          print(json.dumps({
              "runId": run_id,
              "receiptDigest": receipt_digest,
              "transitionDigest": transition_digest,
              "sourceBranch": source_branch,
              "artifactName": str(marker.get("artifactName") or "").strip(),
          }))
          PY
          )"
          run_id="$(jq -r .runId <<<"${coordinates}")"
          receipt_digest="$(jq -r .receiptDigest <<<"${coordinates}")"
          transition_digest="$(jq -r .transitionDigest <<<"${coordinates}")"
          source_branch="$(jq -r .sourceBranch <<<"${coordinates}")"
          requested_name="$(jq -r .artifactName <<<"${coordinates}")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          printf '%s' "${run}" > full-run.json
          source_head="$(jq -r .sourceIdentity.headCommit transition-receipt.json)"
          jq -e --arg head "${source_head}" \
            '.path == ".github/workflows/linktrend-integrator-merge.yml" and
             .event == "pull_request" and .conclusion == "success" and
             (.run_attempt | type == "number") and .run_attempt >= 1 and
             .head_sha == $head' <<<"${run}" >/dev/null \
            || { echo "promotion_receipt_full_run_not_reusable=${run_id}"; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_name="$(jq -r --arg requested "${requested_name}" --arg suffix "-${run_id}" '
            [.artifacts[] | select(.expired == false)
              | select(.name | startswith("linktrend-full-suite-receipt-"))
              | select(.name | endswith($suffix))
              | select($requested == "" or .name == $requested)]
            | if length == 1 then .[0].name else empty end
          ' <<<"${artifacts}")"
          test -n "${artifact_name}" || { echo "promotion_receipt_artifact_not_unique_or_missing=${run_id}"; exit 1; }
          source_pr="$(python3 - "${artifact_name}" "${run_id}" <<'PY'
          import re, sys
          match = re.fullmatch(r"linktrend-full-suite-receipt-([1-9][0-9]*)-" + re.escape(sys.argv[2]), sys.argv[1])
          if not match:
              raise SystemExit("promotion_receipt_artifact_identity_invalid")
          print(match.group(1))
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${source_pr}" > source-pr.json
          printf 'run_id=%s\nrun_attempt=%s\nrun_head=%s\nsource_branch=%s\nsource_pr=%s\nreceipt_digest=%s\ntransition_digest=%s\nartifact_name=%s\n' \
            "${run_id}" "$(jq -r .run_attempt <<<"${run}")" "${source_head}" "${source_branch}" "${source_pr}" \
            "${receipt_digest}" "${transition_digest}" "${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Fetch exact promotion candidate without executing it
        run: |
          set -euo pipefail
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          test -n "${candidate_sha}" || { echo "promotion_receipt_head_missing"; exit 1; }
          git fetch --no-tags origin "${candidate_sha}"
          candidate_dir="$(mktemp -d "${RUNNER_TEMP}/linktrend-receipt-candidate.XXXXXX")"
          git worktree add --detach "${candidate_dir}" "${candidate_sha}"
          echo "${candidate_dir}" > candidate-dir.txt

      - name: Download retained FullSuiteReceipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: receipt-artifact
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact transition-bound promotion receipt
        env:
          RECEIPT_RUN_ID: ${{ steps.receipt.outputs.run_id }}
          RECEIPT_RUN_ATTEMPT: ${{ steps.receipt.outputs.run_attempt }}
          RECEIPT_SOURCE_HEAD: ${{ steps.receipt.outputs.run_head }}
          RECEIPT_DIGEST: ${{ steps.receipt.outputs.receipt_digest }}
          TRANSITION_DIGEST: ${{ steps.receipt.outputs.transition_digest }}
          SOURCE_BRANCH: ${{ steps.receipt.outputs.source_branch }}
        run: |
          set -euo pipefail
          candidate_dir="$(cat candidate-dir.txt)"
          candidate_sha="$(git -C "${candidate_dir}" rev-parse HEAD)"
          python3 scripts/gitops/require_exact_ci_success.py \
            --repository "${GITHUB_REPOSITORY}" --head "${candidate_sha}" \
            --workflow-name "Linktrend Branch Source Policy"
          python3 scripts/gitops/require_exact_ci_success.py \
            --repository "${GITHUB_REPOSITORY}" --head "${candidate_sha}" \
            --workflow-name "Linktrend Receipt Gate"
          python3 scripts/gitops/validate_reusable_full_run.py \
            --run-json full-run.json --source-pr-json source-pr.json \
            --repo "${GITHUB_REPOSITORY}" --head "${RECEIPT_SOURCE_HEAD}" \
            --source-pr "${{ steps.receipt.outputs.source_pr }}"
          mkdir -p .ci-artifacts
          python3 scripts/gitops/gate_receipt.py verify \
            --receipt receipt-artifact/full-suite-receipt.json \
            --repo "${candidate_dir}" \
            --profile full \
            --workflow-run-id "${RECEIPT_RUN_ID}" \
            --workflow-run-attempt "${RECEIPT_RUN_ATTEMPT}" \
            --workflow-head-commit "${RECEIPT_SOURCE_HEAD}" \
            --source-branch "${SOURCE_BRANCH}" \
            --transition-receipt transition-receipt.json \
            --gate full-gate | tee .ci-artifacts/full-suite-reuse.json
          receipt_digest="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.gitops.coordinator.receipts import compute_receipt_digest
          print(compute_receipt_digest(json.loads(Path('receipt-artifact/full-suite-receipt.json').read_text())))
          PY
          )"
          test "${receipt_digest}" = "${RECEIPT_DIGEST}" || { echo "promotion_receipt_digest_mismatch"; exit 1; }
          transition_digest="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.gitops.coordinator.receipts import compute_transition_digest
          print(compute_transition_digest(json.loads(Path('transition-receipt.json').read_text())))
          PY
          )"
          test "${transition_digest}" = "${TRANSITION_DIGEST}" || { echo "promotion_receipt_transition_digest_mismatch"; exit 1; }
          git diff --exit-code
          git diff --cached --exit-code
          echo "LiNKsites Promotion Receipt passed: exact same-tree transition verified; no Full suite rerun."

      - name: Upload promotion receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linksites-promotion-receipt-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
