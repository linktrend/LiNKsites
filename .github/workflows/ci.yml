name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions:
  contents: read

jobs:
  required-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout LiNKsites
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout exact LiNKplatform migration dependency
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKplatform
          ref: 63635ecec576887e5e25080745c4ad169b335508
          path: .ci/linkplatform
          # Private-repository read access must be granted to this workflow.
          # No fallback or skipped RLS suite is permitted if it is absent.
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
      - name: Checkout exact LiNKlibraries authority
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKlibraries
          ref: a7193d40152747db2a03e094fa263f324a971a0b
          path: .ci/linklibraries
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Required production readiness gate
        env:
          LINKSITES_PLATFORM_REPOSITORY: ${{ github.workspace }}/.ci/linkplatform
          W2_02_LIBRARY_REPOSITORY_PATH: ${{ github.workspace }}/.ci/linklibraries
        run: bash scripts/ci-required.sh
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: w2-07-ci-evidence
          path: .ci-artifacts/
          if-no-files-found: error
          include-hidden-files: true
      - name: Dependency and secret scan
        shell: bash
        run: |
          set -euo pipefail
          scan_root="$(mktemp -d)"
          trap 'rm -rf "$scan_root"' EXIT
          git archive HEAD | tar -x -C "$scan_root"
          docker run --rm \
            --volume "$scan_root:/repo:ro" \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir --redact --verbose /repo
