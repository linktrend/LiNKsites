name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging, development]

permissions:
  contents: read
  actions: read

concurrency:
  group: linksites-ci-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event.action || 'push' }}
  cancel-in-progress: true

jobs:
  ordinary-or-promotion-gate:
    name: required-production-gate
    if: github.event_name != 'pull_request' || github.event.action != 'ready_for_review'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout LiNKsites
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'development'
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'development'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fast source checks
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'development'
        run: bash scripts/ci-fast.sh

      - name: Reuse exact full-suite result for promotion
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'development'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_full_suite_receipt.py verify \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --output .ci-artifacts/full-suite-reuse.json
          node deploy/scripts/validate-runtime-config.mjs
          git diff --exit-code
          git diff --cached --exit-code

      - name: Dependency and secret scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-secret-scan.sh

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: linksites-fast-or-release-evidence-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  full-production-suite:
    name: full-production-suite
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout LiNKsites final review commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact LiNKplatform migration dependency
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKplatform
          ref: 63635ecec576887e5e25080745c4ad169b335508
          path: .ci/linkplatform
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout exact LiNKlibraries authority
        uses: actions/checkout@v4
        with:
          repository: linktrend/LiNKlibraries
          ref: a7193d40152747db2a03e094fa263f324a971a0b
          path: .ci/linklibraries
          token: ${{ secrets.LINKTREND_CROSS_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Install dependencies for hosted browser checks
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for hosted browser checks
        run: |
          pnpm --filter @linksites/cms exec playwright install --with-deps chromium
          browser_path="$(pnpm --filter @linksites/cms exec node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "${browser_path}"
          echo "W2_02_CHROMIUM_EXECUTABLE=${browser_path}" >> "${GITHUB_ENV}"
          echo "W2_04_CHROMIUM_EXECUTABLE=${browser_path}" >> "${GITHUB_ENV}"

      - name: Full application and recovery suite
        env:
          LINKSITES_PLATFORM_REPOSITORY: ${{ github.workspace }}/.ci/linkplatform
          W2_02_LIBRARY_REPOSITORY_PATH: ${{ github.workspace }}/.ci/linklibraries
        run: bash scripts/ci-required.sh

      - name: Bind successful suite to exact source and file tree
        env:
          SOURCE_SHA: ${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci_full_suite_receipt.py write \
            --repo "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --tested-sha "${TESTED_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-url "${WORKFLOW_URL}" \
            --output .ci-artifacts/full-suite-receipt.json

      - name: Upload exact full-suite receipt and evidence
        uses: actions/upload-artifact@v4
        with:
          name: linksites-full-suite-${{ github.sha }}
          path: .ci-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
