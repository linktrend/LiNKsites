name: Linktrend Main Receipt Gate

# Main promotion has the same short identity gate as staging.  Principal/Terra
# performs the actual protected-branch operation outside this workflow.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted default-branch workflow; candidate is data only and candidate code is never executed
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|head-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  branch-source-policy:
    name: Linktrend Branch Source Policy
    uses: ./.github/workflows/branch-source-policy.yml
    with:
      source_branch: ${{ github.event.pull_request.head.ref }}
      target_branch: main
    permissions:
      pull-requests: read

  receipt-gate:
    name: Linktrend Receipt Gate
    needs: branch-source-policy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact retained receipt coordinates
        id: receipt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_body=""
          test -n "${PR_NUMBER}" || { echo "receipt_gate_pr_number_missing"; exit 1; }
          pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)"
          export PR_BODY="${pr_body}"
          coordinates="$(python3 - <<'PY'
          import json, os, re
          match = re.search(r"<!-- linktrend-promote:\s*(\{.*?\})\s*-->", os.environ.get("PR_BODY", ""), re.S)
          if not match:
              raise SystemExit("receipt_gate_promotion_marker_missing")
          marker = json.loads(match.group(1))
          run_id = str(marker.get("fullRunId") or "").strip()
          source_pr = str(marker.get("sourcePr") or "").strip()
          receipt_digest = str(marker.get("receiptDigest") or "").strip()
          artifact = str(marker.get("artifactName") or "").strip()
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("receipt_gate_full_run_invalid")
          if not source_pr.isdigit() or int(source_pr) < 1:
              raise SystemExit("receipt_gate_source_pr_invalid")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", receipt_digest):
              raise SystemExit("receipt_gate_receipt_digest_invalid")
          if not artifact:
              raise SystemExit("receipt_gate_artifact_name_missing")
          print(json.dumps({"runId": run_id, "sourcePr": source_pr, "receiptDigest": receipt_digest, "artifactName": artifact}))
          PY
          )"
          run_id="$(jq -r .runId <<<"${coordinates}")"
          source_pr="$(jq -r .sourcePr <<<"${coordinates}")"
          receipt_digest="$(jq -r .receiptDigest <<<"${coordinates}")"
          requested_name="$(jq -r .artifactName <<<"${coordinates}")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          run_head="$(jq -r .head_sha <<<"${run}")"
          run_attempt="$(jq -r .run_attempt <<<"${run}")"
          jq -e --arg repo "${GITHUB_REPOSITORY}" --arg head "${HEAD_SHA}" \
            --argjson source_pr "${source_pr}" \
            '.path == ".github/workflows/linktrend-integrator-merge.yml" and
             .event == "pull_request" and .conclusion == "success" and
             (.run_attempt | type == "number" and . >= 1) and
             (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.pull_requests | any(.[]; .number == $source_pr and
               .base.ref == "development" and
               .base.repo.url == ("https://api.github.com/repos/" + $repo) and
               .head.repo.url == ("https://api.github.com/repos/" + $repo) and
               .head.sha == $head))' <<<"${run}" >/dev/null \
            || { echo "receipt_gate_full_run_not_reusable=${run_id}"; exit 1; }
          test "${run_head}" = "${HEAD_SHA}" || { echo "receipt_gate_run_head_stale=${run_id}"; exit 1; }
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_name="$(jq -r --arg requested "${requested_name}" --arg suffix "-${run_id}" '
            [.artifacts[] | select(.expired == false)
              | select(.name | startswith("linktrend-full-suite-receipt-"))
              | select(.name | endswith($suffix))
              | select(.name == $requested)]
            | if length == 1 then .[0].name else empty end
          ' <<<"${artifacts}")"
          test -n "${artifact_name}" || { echo "receipt_gate_artifact_not_unique_or_missing=${run_id}"; exit 1; }
          printf 'run_id=%s\nrun_attempt=%s\nrun_head=%s\nsource_pr=%s\nreceipt_digest=%s\nartifact_name=%s\n' \
            "${run_id}" "${run_attempt}" "${run_head}" "${source_pr}" "${receipt_digest}" "${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Fetch exact promotion candidate without executing it
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}" || { echo "receipt_gate_head_missing"; exit 1; }
          git fetch --no-tags origin "${HEAD_SHA}"
          candidate_dir="$(mktemp -d "${RUNNER_TEMP}/linktrend-receipt-candidate.XXXXXX")"
          git worktree add --detach "${candidate_dir}" "${HEAD_SHA}"
          echo "${candidate_dir}" > candidate-dir.txt

      - name: Download retained full-suite receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: receipt-artifact
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify receipt identity and branch policy result
        env:
          RECEIPT_RUN_ID: ${{ steps.receipt.outputs.run_id }}
        run: |
          set -euo pipefail
          candidate_dir="$(cat candidate-dir.txt)"
          python3 "$GITHUB_WORKSPACE/scripts/gitops/gate_receipt.py" verify \
            --receipt receipt-artifact/full-suite-receipt.json \
            --repo "${candidate_dir}" \
            --profile full \
            --workflow-run-id "${RECEIPT_RUN_ID}" \
            --workflow-run-attempt "${{ steps.receipt.outputs.run_attempt }}" \
            --workflow-head-commit "${{ steps.receipt.outputs.run_head }}" \
            --gate full-gate
          receipt_digest="$(python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          value = json.loads(Path('receipt-artifact/full-suite-receipt.json').read_text())
          value.pop('receiptDigest', None)
          payload = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode() + b'\n'
          print('sha256:' + hashlib.sha256(payload).hexdigest())
          PY
          )"
          test "${receipt_digest}" = "${{ steps.receipt.outputs.receipt_digest }}" || { echo "receipt_gate_digest_mismatch"; exit 1; }
          echo "Linktrend Receipt Gate passed: exact tree/dependency/profile/workflow identity reused; no full suite rerun."
