name: LiNKsites Scheduled Recovery Proof

on:
  schedule:
    - cron: '31 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-proof:
    name: scheduled-recovery-proof
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ format('playwright-{0}-{1}', runner.os, hashFiles('pnpm-lock.yaml', 'apps/cms/package.json')) }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Install recovery dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @linksites/cms exec playwright install --with-deps chromium
      - name: Run comprehensive disposable recovery rehearsal
        run: pnpm deploy:restore-rehearsal -- --evidence .ci-artifacts/scheduled-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linksites-scheduled-recovery-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
