name: linksites

# Phase 1 bundle only. All ${VAR:?} values are deliberate fail-closed inputs;
# Phase 2 creates their protected runtime file and performs no DNS/domain work
# through this compose definition.
x-runtime: &runtime
  env_file:
    - ${LINKSITES_RUNTIME_ENV_FILE:?set an absolute protected runtime env file}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  deploy:
    resources:
      limits:
        cpus: '1.00'
        memory: 1024M
      reservations:
        memory: 256M
  networks: [internal]

services:
  supabase-migrate:
    image: ${LINKSITES_MIGRATIONS_IMAGE:?set immutable migration image digest}
    build:
      context: ..
      dockerfile: deploy/docker/migrations.Dockerfile
    env_file:
      - ${LINKSITES_RUNTIME_ENV_FILE:?set an absolute protected runtime env file}
    environment:
      LINKSITES_PLATFORM_MIGRATIONS_APPLIED_SHA: ${LINKSITES_PLATFORM_MIGRATIONS_APPLIED_SHA:?set verified platform migration SHA}
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]

  payload-migrate:
    image: ${LINKSITES_WORKER_IMAGE:?set immutable worker image digest}
    build:
      context: ..
      dockerfile: deploy/docker/autowork-worker.Dockerfile
      args:
        LINKSITES_RELEASE_SHA: ${LINKSITES_RELEASE_SHA:?set full release SHA}
    env_file:
      - ${LINKSITES_RUNTIME_ENV_FILE:?set an absolute protected runtime env file}
    depends_on:
      supabase-migrate:
        condition: service_completed_successfully
    command: ["node", "/app/deploy/scripts/entrypoint.mjs", "autowork-worker", "node_modules/.bin/payload", "migrate", "--config", "apps/cms/src/payload.config.ts"]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]

  payload:
    <<: *runtime
    image: ${LINKSITES_CMS_IMAGE:?set immutable CMS image digest}
    build:
      context: ..
      dockerfile: deploy/docker/cms.Dockerfile
      args:
        LINKSITES_RELEASE_SHA: ${LINKSITES_RELEASE_SHA:?set full release SHA}
    depends_on:
      payload-migrate:
        condition: service_completed_successfully
    volumes:
      - linksites-runtime:/var/lib/linksites
    tmpfs: [/tmp]
    networks: [internal, edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:?set Traefik external network name}
      traefik.http.routers.linksites-cms.rule: Host(`${TRAEFIK_CMS_HOST:?set private CMS host}`)
      traefik.http.routers.linksites-cms.entrypoints: ${TRAEFIK_ENTRYPOINT:?set TLS entrypoint}
      traefik.http.routers.linksites-cms.tls: 'true'
      traefik.http.routers.linksites-cms.middlewares: ${TRAEFIK_CMS_PRIVATE_MIDDLEWARE:?set preconfigured CMS privacy middleware}
      traefik.http.services.linksites-cms.loadbalancer.server.port: '3000'

  web-master:
    <<: *runtime
    image: ${LINKSITES_WEB_MASTER_IMAGE:?set immutable web-master image digest}
    build:
      context: ..
      dockerfile: deploy/docker/web-master.Dockerfile
      args:
        LINKSITES_RELEASE_SHA: ${LINKSITES_RELEASE_SHA:?set full release SHA}
        NEXT_PUBLIC_PAYLOAD_API_URL: ${NEXT_PUBLIC_PAYLOAD_API_URL:?set private CMS HTTPS URL}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:?set private CMS HTTPS URL}
    depends_on:
      payload:
        condition: service_healthy
    volumes:
      - linksites-runtime:/var/lib/linksites:ro
    tmpfs: [/tmp]
    networks: [internal, edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:?set Traefik external network name}
      traefik.http.routers.linksites-preview.rule: Host(`${TRAEFIK_PREVIEW_HOST:?set explicit private preview host}`)
      traefik.http.routers.linksites-preview.entrypoints: ${TRAEFIK_ENTRYPOINT:?set TLS entrypoint}
      traefik.http.routers.linksites-preview.tls: 'true'
      traefik.http.routers.linksites-preview.middlewares: ${TRAEFIK_PREVIEW_PRIVATE_MIDDLEWARE:?set preconfigured preview privacy middleware}
      traefik.http.routers.linksites-preview.priority: '100'
      traefik.http.services.linksites-preview.loadbalancer.server.port: '3000'

  autowork-worker:
    <<: *runtime
    image: ${LINKSITES_WORKER_IMAGE:?set immutable worker image digest}
    build:
      context: ..
      dockerfile: deploy/docker/autowork-worker.Dockerfile
      args:
        LINKSITES_RELEASE_SHA: ${LINKSITES_RELEASE_SHA:?set full release SHA}
    depends_on:
      payload:
        condition: service_healthy
    volumes:
      - linksites-runtime:/var/lib/linksites

  program-orchestrator:
    <<: *runtime
    image: ${LINKSITES_ORCHESTRATOR_IMAGE:?set immutable orchestrator image digest}
    build:
      context: ..
      dockerfile: deploy/docker/program-orchestrator.Dockerfile
      args:
        LINKSITES_RELEASE_SHA: ${LINKSITES_RELEASE_SHA:?set full release SHA}
    depends_on:
      payload:
        condition: service_healthy
      web-master:
        condition: service_healthy
    volumes:
      - linksites-runtime:/var/lib/linksites
      - ${LINKLIBRARIES_ARTIFACT_PATH:?set approved LiNKlibraries artifact directory}:/var/lib/linksites/linklibraries:ro

networks:
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:?set Traefik external network name}
  internal:
    internal: true

volumes:
  linksites-runtime:
