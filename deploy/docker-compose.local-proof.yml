# Disposable W2-07 proof overlay.  It is intentionally layered over the
# deployable Compose file so the five LiNKsites service definitions, ordered
# migrations, security settings, and runtime configuration contract are the
# ones exercised.  It never contacts a VPS, cloud, DNS provider, or public
# hostname.  All credentials, certificates, Postgres data, and evidence are
# generated below a unique host temporary directory by rehearse-compose-stack.
services:
  local-postgres:
    image: postgres:16.8-alpine@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-proof-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${LINKSITES_LOCAL_PROOF_PLATFORM_BOOTSTRAP:?set generated local platform bootstrap}:/docker-entrypoint-initdb.d/10-platform-bootstrap.sql:ro
    networks: [internal]

  local-tls:
    image: traefik:v3.0@sha256:a208c74fd80a566d4ea376053bff73d31616d7af3f1465a7747b8b89ee34d97e
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.dashboard=false
      - --log.level=WARN
    ports:
      - 127.0.0.1:${LINKSITES_LOCAL_PROOF_TLS_PORT:?set local proof TLS port}:443
    volumes:
      - ${LINKSITES_LOCAL_PROOF_TLS_DIR:?set generated local TLS directory}:/etc/traefik:ro
    networks:
      internal:
        aliases: [cms.localtest, preview.localtest]

  supabase-migrate:
    depends_on:
      local-postgres:
        condition: service_healthy

  payload-seed:
    image: ${LINKSITES_WORKER_IMAGE:?set local proof worker image}
    env_file:
      - ${LINKSITES_RUNTIME_ENV_FILE:?set generated local proof runtime env}
    environment:
      LINKSITES_W2_04_LOCAL_PROOF: '1'
      W2_04_PROOF_PATH: /var/lib/linksites/seed.json
    # The proof network is deliberately isolated. Invoke the CMS-local runner
    # already bundled in the immutable worker image instead of Corepack/pnpm,
    # which can otherwise attempt a registry download at runtime.
    working_dir: /app/apps/cms
    command: ["node", "/app/deploy/scripts/entrypoint.mjs", "autowork-worker", "node_modules/.bin/tsx", "scripts/w2-04-seed.ts"]
    depends_on:
      payload:
        condition: service_healthy
    volumes:
      - ${LINKSITES_LOCAL_PROOF_RUNTIME_DIR:?set generated local proof runtime directory}:/var/lib/linksites
    networks: [internal]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  payload:
    volumes:
      - ${LINKSITES_LOCAL_PROOF_RUNTIME_DIR:?set generated local proof runtime directory}:/var/lib/linksites

  web-master:
    # Do not start the renderer until the disposable Payload seed has produced
    # the exact verified library-admission receipt/evidence that this proof
    # must consume. The production Compose definition never uses this launcher.
    depends_on:
      payload-seed:
        condition: service_completed_successfully
    command: ["node", "/app/deploy/scripts/local-proof-web-master-entrypoint.mjs"]
    environment:
      NODE_EXTRA_CA_CERTS: /run/linksites-local-proof/ca.crt
    volumes:
      - ${LINKSITES_LOCAL_PROOF_RUNTIME_DIR:?set generated local proof runtime directory}:/var/lib/linksites:ro
      - ${LINKSITES_LOCAL_PROOF_TLS_DIR:?set generated local TLS directory}/ca.crt:/run/linksites-local-proof/ca.crt:ro

  autowork-worker:
    volumes:
      - ${LINKSITES_LOCAL_PROOF_RUNTIME_DIR:?set generated local proof runtime directory}:/var/lib/linksites

  program-orchestrator:
    environment:
      NODE_EXTRA_CA_CERTS: /run/linksites-local-proof/ca.crt
    ports:
      - 127.0.0.1:${LINKSITES_LOCAL_PROOF_ORCHESTRATOR_PORT:?set local proof orchestrator port}:3000
    depends_on:
      payload-seed:
        condition: service_completed_successfully
    volumes:
      - ${LINKSITES_LOCAL_PROOF_RUNTIME_DIR:?set generated local proof runtime directory}:/var/lib/linksites
      - ${LINKSITES_LOCAL_PROOF_TLS_DIR:?set generated local TLS directory}/ca.crt:/run/linksites-local-proof/ca.crt:ro
      - ${LINKLIBRARIES_ARTIFACT_PATH:?set approved local LiNKlibraries checkout}:/var/lib/linksites/linklibraries:ro

networks:
  edge:
    external: false
    name: ${COMPOSE_PROJECT_NAME:?set local proof project name}-edge
